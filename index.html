<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CoTribu</title>
<meta name="description" content="L'organisation de la maison, partagée par toute la famille.">
<meta name="theme-color" content="#789985">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Palette CoTribu (charte de Tony) */
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --surface2:#F1EFEA; --ink:#343532; --muted:#797A74; --faint:#B7B7B1; --line:#E8E6E1;
  --accent:#789985; --accent-ink:#FFFFFF; --accent-soft:#DDE8E0; --accent-text:#50705D;
  --home:#DDE8E0; --done:#4CAF7B; --late:#E07A5F; --late-soft:#FBE7E0; --late-text:#B4533A; --danger:#B4533A;
  --warm:#D98C6A;
  --shadow:0 1px 2px rgba(52,53,50,.05),0 4px 16px rgba(52,53,50,.05);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1F201E; --surface:#282A27; --surface2:#323430; --ink:#EEEDE8; --muted:#A9AAA3; --faint:#6E706A; --line:#3A3C38;
    --accent:#8FB19C; --accent-ink:#1F201E; --accent-soft:#33443A; --accent-text:#A9C9B5;
    --home:#2E3D34; --done:#5CBF8A; --late:#E8957E; --late-soft:#43302A; --late-text:#EFA995; --danger:#EFA995;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1F201E; --surface:#282A27; --surface2:#323430; --ink:#EEEDE8; --muted:#A9AAA3; --faint:#6E706A; --line:#3A3C38;
  --accent:#8FB19C; --accent-ink:#1F201E; --accent-soft:#33443A; --accent-text:#A9C9B5;
  --home:#2E3D34; --done:#5CBF8A; --late:#E8957E; --late-soft:#43302A; --late-text:#EFA995; --danger:#EFA995;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.45;color:var(--ink);padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:600}
h1{font-size:31px;line-height:1.1;font-weight:600}
h2{font-size:21px;font-weight:600}
h3{font-size:17px;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.head{display:flex;flex-direction:column;gap:4px}
.head .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.sync.local i{background:var(--late)}

/* segmented */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* progress */
.summary{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px}
.summary .txt{display:flex;flex-direction:column;gap:2px}
.summary strong{font-size:18px;font-family:var(--display)}

/* groups */
.group{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--home)}
.group.late .ghead{background:var(--late-soft)}
.bar{margin-top:0!important}
.ghead h3{flex:1}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.pill{font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.ok{background:var(--accent-soft);color:var(--accent-text)}
.pill.late{background:var(--late-soft);color:var(--late-text)}
.bar{height:3px;background:var(--home);margin:0;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent)}
.group.late .ghead h3{color:var(--late-text)}

.task{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);min-height:56px}
.task:first-of-type{border-top:0}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.check svg{width:16px;height:16px;opacity:0}
.task.done .check{background:var(--done);border-color:var(--done)}
.task.done .check svg{opacity:1}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task .name{font-weight:600;overflow-wrap:anywhere}
.task.done .name{text-decoration:line-through;color:var(--muted);font-weight:500}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.late{background:var(--late-soft);color:var(--late-text)}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#343532;flex:none;border:2px solid var(--surface)}
.avs .av+.av{margin-left:-7px}
.av.free{background:var(--surface2);color:var(--muted);font-size:14px}
.av.lg{width:40px;height:40px;font-size:16px}

.empty{background:var(--surface);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.tomorrow{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font-size:11px;background:var(--accent-ink);color:var(--accent-text);border-radius:99px;width:18px;height:18px;display:inline-grid;place-items:center}
.chip.sq{border-radius:10px;min-width:40px;justify-content:center}
.info{font-size:14px;color:var(--muted);display:flex;gap:6px}

/* week */
details.day{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
details.day summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
details.day summary::-webkit-details-marker{display:none}
.dnum{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.dnum b{font-family:var(--display);font-size:22px}
.dnum small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
details.day.today .dnum b{color:var(--accent-text)}
.dsum{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dsum .rooms{font-weight:600;overflow-wrap:anywhere}
.chev{color:var(--muted);transition:transform .2s}
details[open] .chev{transform:rotate(90deg)}
.dlist{border-top:1px solid var(--line);padding:6px 0}
.dline{display:flex;align-items:center;gap:10px;padding:7px 16px;font-size:15px}
.dline .t{flex:1;min-width:0}
.dline .r{font-size:12px;color:var(--muted)}

/* maison */
.room .task{cursor:pointer}
.room .task .go{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent-text)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.block{width:100%}
.addrow{border-top:1px solid var(--line);display:flex}
.addrow .btn{flex:1;justify-content:flex-start;padding-left:16px;border-radius:0}
.iconbtn{border:0;background:var(--surface2);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}

/* foyer */
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;align-items:center;gap:10px}
.mrow input{flex:1;min-width:0}
input[type=text],input[type=number],select{background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px;width:100%}
input:focus,select:focus{border-color:var(--accent-text);outline:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
label.f input,label.f select{font-weight:400;font-size:16px;color:var(--ink)}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.frow > *{flex:1;min-width:120px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent-text)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,20,17,.45)}
#sheet .panel{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 0}
.sect{display:flex;flex-direction:column;gap:8px}
.preview{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.preview b{color:var(--accent-text)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

.brand{display:flex;align-items:center;gap:14px;padding-top:24px}
.brand h1{font-size:34px}
.code{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.18em;text-align:center;background:var(--accent-soft);color:var(--accent-text);border-radius:14px;padding:10px 0}
.codein{font-family:var(--display);font-size:26px!important;letter-spacing:.3em;text-align:center;text-transform:uppercase}
#inv-link{font-size:13px;color:var(--muted)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.card.install{border:1.5px solid var(--accent-soft)}
.btn[disabled]{opacity:.6;cursor:progress}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ---------- dates (all UTC-based day math) ---------- */
const DAY = 864e5;
const pad = n => String(n).padStart(2, '0');
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const idx = ds => { const [y,m,d] = ds.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/DAY); };
const fromIdx = i => { const d = new Date(i*DAY); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const addDays = (ds,n) => fromIdx(idx(ds)+n);
const dow = ds => (idx(ds)+4)%7; // 0 = dimanche
const mondayOf = ds => addDays(ds, -((dow(ds)+6)%7));
const mod = (a,n) => ((a%n)+n)%n;
const ymd = ds => ds.split('-').map(Number);
const dim = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
const isoWeek = ds => { const i = idx(ds), th = i + 3 - ((dow(ds)+6)%7); const y = new Date(th*DAY).getUTCFullYear(); return 1 + Math.floor((th - idx(`${y}-01-01`))/7); };
const fmt = (ds,o) => new Intl.DateTimeFormat('fr-FR',{timeZone:'UTC',...o}).format(new Date(idx(ds)*DAY));
const fmtShort = ds => fmt(ds,{weekday:'short',day:'numeric',month:'short'});
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

const DAYN = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const DAYL = ['D','L','M','M','J','V','S'];
const MON = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MONS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const COLORS = ['#D98C6A','#9DB9C8','#B8AED1','#E8B7B4','#E5C77A','#A7C4A0','#9AA7B0','#DCCDBF'];

/* ---------- recurrence engine ---------- */
function isOn(rec, ds){
  if (!rec) return false;
  if (rec.type === 'weekly'){
    if (!(rec.days||[]).includes(dow(ds))) return false;
    const w = Math.floor((idx(ds) - idx(rec.anchor || ds))/7);
    return mod(w, rec.every||1) === 0;
  }
  if (rec.type === 'monthly'){
    const [y,m,d] = ymd(ds);
    if (rec.months && rec.months.length){ if (!rec.months.includes(m)) return false; }
    else { const [ay,am] = (rec.anchor||ds).split('-').map(Number); if (mod((y-ay)*12 + (m-am), rec.every||1) !== 0) return false; }
    const last = dim(y,m);
    if (rec.mode === 'day') return d === Math.min(rec.day||1, last);
    if (dow(ds) !== rec.weekday) return false;
    if (rec.nth === -1) return d + 7 > last;
    return Math.ceil(d/7) === rec.nth;
  }
  return false;
}
function nextOcc(rec, from, n=1){
  const out=[]; for (let i=0;i<800 && out.length<n;i++){ const ds=addDays(from,i); if (isOn(rec,ds)) out.push(ds); } return out;
}
function prevOcc(rec, before){
  for (let i=1;i<400;i++){ const ds=addDays(before,-i); if (isOn(rec,ds)) return ds; } return null;
}
function intervalDue(t){ return t.lastDone ? addDays(t.lastDone, t.rec.days) : (t.rec.anchor || t.createdAt); }

function recLabel(rec){
  if (!rec) return '';
  if (rec.type === 'weekly'){
    const days = WEEK_ORDER.filter(d => (rec.days||[]).includes(d));
    const e = rec.every||1;
    if (days.length === 7 && e === 1) return 'Tous les jours';
    const names = days.map(d => DAYN[d]);
    const list = names.length > 1 ? names.slice(0,-1).join(', ') + ' et ' + names.at(-1) : names[0] || '—';
    if (e === 1) return names.length === 1 ? 'Chaque ' + list : cap(list);
    if (e === 2) return names.length === 1 ? `Un ${list} sur deux` : `${cap(list)}, une semaine sur deux`;
    return `${cap(list)}, toutes les ${e} semaines`;
  }
  if (rec.type === 'monthly'){
    const part = rec.mode === 'day' ? `le ${rec.day===1?'1er':rec.day}` : `${rec.nth===1?'1er':rec.nth===-1?'dernier':rec.nth+'e'} ${DAYN[rec.weekday]}`;
    if (rec.months && rec.months.length){
      const ms = [...rec.months].sort((a,b)=>a-b).map(m=>MON[m-1]);
      if (ms.length === 1) return `${cap(part)} de ${ms[0]}, chaque année`;
      return `${cap(part)} de ${ms.slice(0,-1).join(', ')} et ${ms.at(-1)}`;
    }
    const e = rec.every||1;
    return e === 1 ? `${cap(part)} du mois` : `${cap(part)} du mois, tous les ${e} mois`;
  }
  if (rec.type === 'interval'){
    const n = rec.days;
    if (n % 30 === 0) return n === 30 ? 'Environ tous les mois' : `Environ tous les ${n/30} mois`;
    if (n % 7 === 0) return n === 7 ? 'Environ chaque semaine' : `Environ toutes les ${n/7} semaines`;
    return n === 1 ? 'Tous les jours' : `Tous les ${n} jours`;
  }
  return '';
}
const isRoutine = rec => rec && rec.type === 'weekly' && (rec.every||1) === 1;

/* assignment */
function assigneesOn(t, ds){
  const a = t.assign || {mode:'anyone'};
  const ids = (a.members||[]).filter(id => S.members.has(id));
  if (a.mode === 'fixed') return ids;
  if (a.mode === 'rotation' && ids.length){
    const w = Math.floor((idx(ds) - idx(a.anchor || mondayOf(ds)))/7);
    return [ids[mod(w, ids.length)]];
  }
  return [];
}

/* status for today */
function todayStatus(t, today){
  if (t.rec.type === 'interval'){
    const due = intervalDue(t);
    const doneToday = t.lastDone === today;
    if (doneToday) return {show:true, done:true, late:false};
    if (due <= today) return {show:true, done:false, late: due < today, since: due};
    return {show:false};
  }
  const done = !!(t.done && t.done[today]);
  const sched = isOn(t.rec, today);
  if (sched || done) return {show:true, done, late:false};
  if (t.carry){
    const p = prevOcc(t.rec, today);
    const base = t.lastDone || addDays(t.createdAt || today, -1);
    if (p && p > base) return {show:true, done:false, late:true, since:p};
  }
  return {show:false};
}
/* occurrence on a future day (week view) */
function onDay(t, ds, today){
  if (ds === today) { const s = todayStatus(t,today); return s.show && !s.late; }
  if (t.rec.type === 'interval'){
    // project forward, assuming anything due by today gets done today
    let due = intervalDue(t);
    if (t.lastDone === today || due <= today) due = addDays(today, t.rec.days);
    const diff = idx(ds) - idx(due);
    return diff >= 0 && diff % t.rec.days === 0;
  }
  return isOn(t.rec, ds);
}

      ${late.map(x => taskRow(x.t, x.st, today, x.room.name)).join('')}</section>`;
  }
  for (const g of groups){
    const d = g.items.filter(x=>x.st.done).length, n = g.items.length;
    h += `<section class="group"><div class="ghead"><span class="dot" style="background:${roomColor(g.r)}"></span><h3>${esc(g.r.name)}</h3><span class="pill ${d===n?'ok':''} num">${d}/${n}</span></div>
      <div class="bar"><b style="width:${Math.round(d/n*100)}%"></b></div>
      ${g.items.map(x => taskRow(x.t, x.st, today)).join('')}</section>`;
  }
  if (!total && !late.length){
    h += `<div class="empty"><h3>Rien de prévu aujourd’hui</h3><span class="muted">${S.filter==='me' ? 'Aucune tâche à ton nom. Regarde « Tout le foyer ».' : 'Profitez-en.'}</span></div>`;
  }
  // tomorrow preview
  const tm = addDays(today,1);
  const tmRooms = rooms.map(r => ({r, n:[...S.tasks.values()].filter(t=>t.roomId===r.id && onDay(t,tm,today)).length})).filter(x=>x.n);
  if (tmRooms.length){
    h += `<div class="tomorrow"><span class="eyebrow">Demain, ${esc(fmt(tm,{weekday:'long'}))}</span><div class="chips">${tmRooms.map(x=>`<span class="chip" style="cursor:default"><span class="dot" style="background:${roomColor(x.r)}"></span>${esc(x.r.name)} <span class="muted num">${x.n}</span></span>`).join('')}</div></div>`;
  }
  return h;
}

function viewWeek(){
  const today = localToday();
  let h = header('Les 7 prochains jours');
  h += `<p class="muted small" style="margin:0">Ce qui revient rarement (vitres, draps, four) n’apparaît que le jour où il faut le faire.</p>`;
  const rooms = sorted(S.rooms);
  for (let i=0;i<7;i++){
    const ds = addDays(today,i);
    const lines = [];
    rooms.forEach(r => sorted(new Map([...S.tasks].filter(([,t])=>t.roomId===r.id))).forEach(t => { if (onDay(t,ds,today)) lines.push({t,r}); }));
    const roomNames = [...new Set(lines.map(l=>l.r.name))];
    const people = [...new Set(lines.flatMap(l=>assigneesOn(l.t,ds)))];
    h += `<details class="day ${i===0?'today':''}" ${i===0?'open':''}><summary>
      <span class="dnum"><small>${esc(fmt(ds,{weekday:'short'}).replace('.',''))}</small><b class="num">${ymd(ds)[2]}</b></span>

function nextLabel(t, today){
  if (t.rec.type === 'interval'){ const due = intervalDue(t); return due <= today ? (due < today ? 'En retard' : 'Aujourd’hui') : fmtShort(due); }
  const n = nextOcc(t.rec, today)[0]; return n ? (n === today ? 'Aujourd’hui' : fmtShort(n)) : '—';
}
function assignLabel(t, today){
  const a = t.assign || {mode:'anyone'};
  const ids = (a.members||[]).filter(id=>S.members.has(id));
  if (a.mode === 'rotation' && ids.length) return 'Chacun son tour : ' + ids.map(nameOf).join(' → ');
  if (a.mode === 'fixed' && ids.length) return ids.map(nameOf).join(', ');
  return 'Qui veut';
}

/* ---------- sheets ---------- */
function openSheet(kind){ S.sheet = kind; S.armed = null; renderSheet(); document.getElementById('sheet').hidden = false; }
function closeSheet(){ S.sheet = null; S.draft = null; S.armed = null; document.getElementById('sheet').hidden = true; }

function draftFromTask(t, roomId){
  const today = localToday(), mon = mondayOf(today);
  const base = t ? clone(t) : {id:null, name:'', roomId, rec:{type:'weekly',days:[dow(today)],every:1,anchor:mon}, carry:false, assign:{mode:'anyone',members:[]}};
  const recs = {
    weekly:{type:'weekly', days:[dow(today)], every:1, anchor:mon},
    monthly:{type:'monthly', mode:'nth', nth:1, weekday:dow(today), day:1, every:1, months:[], anchor:today.slice(0,7)},
    interval:{type:'interval', days:14, anchor:today},
  };
  recs[base.rec.type] = {...recs[base.rec.type], ...clone(base.rec)};
  if (!recs.monthly.months) recs.monthly.months = [];
  const ivUnit = base.rec.type==='interval' ? (base.rec.days%30===0?30:base.rec.days%7===0?7:1) : 7;
  return {...base, rtype:base.rec.type, recs, ivUnit, ivN: base.rec.type==='interval' ? base.rec.days/ivUnit : 2,
    mfreq: (recs.monthly.months.length ? 'months' : String(recs.monthly.every||1)),
    assign:{mode:base.assign?.mode||'anyone', members:[...(base.assign?.members||[])], anchor:base.assign?.anchor||mon}};
}
function draftRec(d){
  const today = localToday();
  if (d.rtype === 'interval') return {type:'interval', days:Math.max(1, Math.round((+d.ivN||1)*d.ivUnit)), anchor: d.recs.interval.anchor || today};
  if (d.rtype === 'monthly'){
    const m = d.recs.monthly;
    const r = {type:'monthly', mode:m.mode, anchor:m.anchor||today.slice(0,7), every: d.mfreq==='months' ? 1 : +d.mfreq, months: d.mfreq==='months' ? [...m.months] : []};
    if (m.mode === 'day') r.day = Math.min(31, Math.max(1, +m.day||1)); else { r.nth = +m.nth; r.weekday = +m.weekday; }
    return r;
  }
  const w = d.recs.weekly; return {type:'weekly', days:[...w.days], every:+w.every||1, anchor:w.anchor||mondayOf(today)};
}

function renderSheet(){
  const el = document.getElementById('sheetBody');
  const focused = document.activeElement && document.activeElement.id;
  if (S.sheet === 'task') el.innerHTML = sheetTask();
  else if (S.sheet === 'room') el.innerHTML = sheetRoom();
  if (focused) { const f = document.getElementById(focused); if (f && el.contains(f)) { f.focus(); if (f.setSelectionRange && f.type==='text') { const l=f.value.length; f.setSelectionRange(l,l); } } }
}

function toggleTask(id){
    const today = localToday();
  const t = clone(S.tasks.get(id)); if (!t) return;
  t.done = t.done || {};
  const st = todayStatus(t, today);
  const who = S.me || assigneesOn(t, today)[0] || null;
  if (st.done){
    delete t.done[today];
    const past = Object.keys(t.done).sort();
    t.lastDone = past.at(-1) || null; t.lastBy = t.lastDone ? t.done[t.lastDone] : null;
  } else {
    t.done[today] = who || 'x'; t.lastDone = today; t.lastBy = who;
    const keys = Object.keys(t.done).sort(); while (keys.length > 40) delete t.done[keys.shift()];
  }
  put('tasks', t); render();
}

const handlers = {
  tab: el => { S.tab = el.dataset.v; S.armed = null; render(); window.scrollTo(0,0); },
  filter: el => { S.filter = el.dataset.v; LS.set('cotribu-filter', S.filter); render(); },
  me: el => setMe(el.dataset.id),
  retry: () => { S.mode = 'loading'; S.errMsg = null; render(); safeBoot(); },
  wMode: el => { S.welcomeMode = el.dataset.v; render(); },
  join: () => joinHousehold(),
  share: () => shareInvite(),
  install: async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; render(); },
  later: () => { LS.set('cotribu-install-later', String(Date.now() + 3*DAY)); render(); },
  leave: () => { if (S.armed !== 'leave') { S.armed = 'leave'; render(); return; } S.armed = null; leaveHousehold(); },
  toggle: el => toggleTask(el.dataset.id),
  close: () => closeSheet(),
  editTask: el => { S.draft = draftFromTask(S.tasks.get(el.dataset.id)); openSheet('task'); },
  newTask: el => { S.draft = draftFromTask(null, el.dataset.room); openSheet('task'); },
  rtype: el => { S.draft.rtype = el.dataset.v; renderSheet(); },
  carry: el => { S.draft.carry = el.dataset.v === '1'; renderSheet(); },
  wday: el => { const w = S.draft.recs.weekly, v = +el.dataset.v; w.days = w.days.includes(v) ? w.days.filter(x=>x!==v) : [...w.days, v]; renderSheet(); },
  mmonth: el => { const m = S.draft.recs.monthly, v = +el.dataset.v; m.months = m.months.includes(v) ? m.months.filter(x=>x!==v) : [...m.months, v]; renderSheet(); },
  amode: el => { S.draft.assign.mode = el.dataset.v; renderSheet(); },
  amember: el => { const a = S.draft.assign, id = el.dataset.id; a.members = a.members.includes(id) ? a.members.filter(x=>x!==id) : [...a.members, id]; renderSheet(); },
  saveTask: () => {
    const d = S.draft; const name = d.name.trim();
    if (!name) { toast('Donnez un nom à la tâche.'); document.getElementById('t-name')?.focus(); return; }
    const rec = draftRec(d);
    if (rec.type==='weekly' && !rec.days.length) { toast('Choisissez au moins un jour.'); return; }
    if (rec.type==='monthly' && d.mfreq==='months' && !rec.months.length) { toast('Choisissez au moins un mois.'); return; }
    const old = d.id ? S.tasks.get(d.id) : null;
    const today = localToday();
    const siblings = [...S.tasks.values()].filter(t=>t.roomId===d.roomId);
    const t = {
      id: d.id || uid('t'), roomId:d.roomId, name, rec, carry: rec.type==='interval' ? true : !!d.carry,
      assign:{mode:d.assign.mode, members: d.assign.mode==='anyone' ? [] : d.assign.members, anchor:d.assign.anchor || mondayOf(today)},
      order: old ? old.order : (Math.max(0,...siblings.map(s=>s.order||0))+1),
      createdAt: old ? old.createdAt : today, lastDone: old ? old.lastDone : null, lastBy: old ? (old.lastBy||null) : null, done: old ? clone(old.done||{}) : {},
    };
    if (old && JSON.stringify(old.rec) !== JSON.stringify(rec)) t.createdAt = today; // new rule: no retroactive lateness
    put('tasks', t); closeSheet(); render(); toast(d.id ? 'Tâche modifiée' : 'Tâche ajoutée');
  },
  delTask: () => { if (S.armed !== 'task') { S.armed = 'task'; renderSheet(); return; } del('tasks', S.draft.id); closeSheet(); render(); toast('Tâche supprimée'); },
  newRoom: () => { S.draft = {id:null, name:'', assign:{mode:'fixed', members:[]}}; openSheet('room'); },
  editRoom: el => { const r = S.rooms.get(el.dataset.id); S.draft = {...clone(r), assign:{mode:'rotation', members:[]}}; openSheet('room'); },
  ramode: el => { S.draft.assign.mode = el.dataset.v; renderSheet(); },
  ramember: el => { const a = S.draft.assign, id = el.dataset.id; a.members = a.members.includes(id) ? a.members.filter(x=>x!==id) : [...a.members, id]; renderSheet(); },
  applyRoom: () => {
    const a = S.draft.assign;
    if (a.mode !== 'anyone' && !a.members.length) { toast('Choisissez au moins une personne.'); return; }
    const mon = mondayOf(localToday());
    putMany('tasks', [...S.tasks.values()].filter(t=>t.roomId===S.draft.id).map(t => { const c = clone(t); c.assign = {mode:a.mode, members: a.mode==='anyone'?[]:[...a.members], anchor:mon}; return c; }));
    closeSheet(); render(); toast('Répartition appliquée');
  },
  saveRoom: () => {
    const d = S.draft; const name = (d.name||'').trim(); if (!name) { toast('Donnez un nom à la pièce.'); return; }
    const old = d.id ? S.rooms.get(d.id) : null;
    put('rooms', {id: d.id || uid('r'), name, order: old ? old.order : Math.max(0,...[...S.rooms.values()].map(r=>r.order||0))+1});
    closeSheet(); render(); toast(d.id ? 'Pièce renommée' : 'Pièce ajoutée');
  },
  delRoom: () => {
    if (S.armed !== 'room') { S.armed = 'room'; renderSheet(); return; }
    const id = S.draft.id; [...S.tasks.values()].filter(t=>t.roomId===id).forEach(t=>del('tasks', t.id)); del('rooms', id);
    closeSheet(); render(); toast('Pièce supprimée');
  },
  color: el => { const m = clone(S.members.get(el.dataset.id)); m.color = ((m.color||0)+1) % COLORS.length; put('members', m); render(); },
  addMember: () => { const ms = sorted(S.members); const m = {id:uid('m'), name:'Nouveau membre', color: ms.length % COLORS.length, order:(Math.max(-1,...ms.map(x=>x.order||0))+1)}; put('members', m); render(); setTimeout(()=>{ const i = document.getElementById('m-'+m.id); if (i){ i.focus(); i.select(); } }, 30); },
  delMember: el => { const k = 'm'+el.dataset.id; if (S.armed !== k) { S.armed = k; render(); return; } S.armed = null; del('members', el.dataset.id); if (S.me === el.dataset.id) { S.me = null; } render(); },
  reset: async () => {
    if (S.armed !== 'reset') { S.armed = 'reset'; render(); return; }
    S.armed = null;
    const names = sorted(S.members);
    const tpl = buildTemplate(names.length ? names.map(m=>m.name) : ['Moi'], localToday());
    const map = {}; tpl.members.forEach((m,i)=>{ map[m.id] = names[i] ? names[i].id : m.id; });
    tpl.tasks.forEach(t=>{ t.assign.members = t.assign.members.map(id=>map[id]); });
    const {error} = await sb.from('docs').delete().eq('household_id', S.hh.id).in('col', ['rooms','tasks']);
    if (error) { toast(explain(error)); return; }
    S.rooms = new Map(); S.tasks = new Map();
    if (!names.length) await putMany('members', tpl.members);
    await putMany('rooms', tpl.rooms); await putMany('tasks', tpl.tasks);
    render(); toast('Modèle rechargé');
  },
  wAdd: () => { S.welcome.push(''); render(); },
  wGo: () => createHousehold(),
};
const changes = {
  homeName: el => putMeta({...S.meta, name: el.value.trim() || 'Notre maison'}),
  memberName: el => { const m = clone(S.members.get(el.dataset.id)); const v = el.value.trim(); if (!v || v === m.name) return; m.name = v; put('members', m); render(); },
  tName: el => { S.draft.name = el.value; },
  tRoom: el => { S.draft.roomId = el.value; },
  rName: el => { S.draft.name = el.value; },
  wEvery: el => { S.draft.recs.weekly.every = +el.value; renderSheet(); },
  wStart: el => { S.draft.recs.weekly.anchor = addDays(mondayOf(localToday()), +el.value); renderSheet(); },
  moMode: el => { S.draft.recs.monthly.mode = el.value; renderSheet(); },
  moDay: el => { S.draft.recs.monthly.day = +el.value; renderSheet(); },
  moNth: el => { S.draft.recs.monthly.nth = +el.value; renderSheet(); },
  moWd: el => { S.draft.recs.monthly.weekday = +el.value; renderSheet(); },
  moFreq: el => { S.draft.mfreq = el.value; renderSheet(); },
  ivN: el => { S.draft.ivN = el.value; renderSheet(); },
  ivUnit: el => { S.draft.ivUnit = +el.value; renderSheet(); },
  wHome: el => { S.wHome = el.value; },
  wName: el => { S.welcome[+el.dataset.i] = el.value; },
  jCode: el => { const v = el.value.toUpperCase().replace(/[^A-Z0-9]/g,''); if (v !== el.value) el.value = v; S.joinCode = v; },
};
const liveInputs = new Set(['tName','rName','wHome','wName','jCode']);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const h = handlers[el.dataset.act]; if (h) { e.preventDefault(); h(el); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); handlers[e.target.dataset.act](e.target); }
  if (e.key === 'Escape' && S.sheet) closeSheet();
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.ch; if (k && liveInputs.has(k)) changes[k](e.target); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.ch; if (k && !liveInputs.has(k)) changes[k](e.target); });

// refresh at midnight / when returning to the app
let lastDay = localToday();
setInterval(() => { if (localToday() !== lastDay) { lastDay = localToday(); render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && localToday() !== lastDay) { lastDay = localToday(); render(); } });

function safeBoot(){ boot().catch(e => { console.error(e); S.errMsg = (e && e.message) || String(e); S.mode = 'error'; render(); }); }
setTimeout(() => { if (S.mode === 'loading') { S.errMsg = 'Le serveur ne répond pas (délai dépassé).'; S.mode = 'error'; render(); } }, 15000);
safeBoot();
</script>
