<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>CoTribu</title>
<meta name="description" content="Le quotidien se partage : tâches, courses, planning, repas et souvenirs de la famille.">
<meta name="theme-color" content="#789985">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap" id="view"><div class="loading">Chargement de la tribu…</div></div>

<nav class="tabs" aria-label="Navigation" hidden><div class="in" id="tabs"></div></nav>

<div id="sheet" hidden><div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true" id="sheetBody"></div></div>
<div id="toast" hidden></div>
<div id="update" hidden role="status"><span style="flex:1">Nouvelle version de CoTribu disponible</span><button onclick="applyUpdate()">Mettre à jour</button></div>

<script src="vendor/supabase-2.117.2.js"></script>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/maison.js"></script>
<script src="js/courses.js"></script>
<script src="js/planning.js"></script>
<script src="js/extras.js"></script>
<script src="js/accueil.js"></script>
<script src="js/push.js"></script>
<script src="js/proches.js"></script>
<script src="js/premium.js"></script>
<script src="js/ai.js"></script>
<script src="js/points.js"></script>
<script src="js/family.js"></script>
<script src="js/guide.js"></script>
<script src="js/moments.js"></script>
<script src="js/launch.js"></script>
<script src="js/drag.js"></script>
<script src="js/social.js"></script>
<script src="js/places.js"></script>
<script src="js/feedback.js"></script>
<script src="js/rating.js"></script>
<script src="js/schedule.js"></script>
<script src="js/cook.js"></script>
<script>
document.getElementById('tabs').innerHTML = [['today','house','Aujourd’hui'],['planning','calendar-days','Planning'],['maison','circle-check','Maison'],['courses','shopping-cart','Courses'],['plus','ellipsis','Plus']]
  .map(([v,ic,l]) => `<button data-act="tab" data-v="${v}">${icon(ic,24)}${l}</button>`).join('');
function safeBoot(){ boot().catch(e => { console.error(e); S.errMsg = (e && e.message) || String(e); S.mode = 'error'; render(); }); }
setTimeout(() => { if (S.mode === 'loading') { S.errMsg = 'Le serveur ne répond pas (délai dépassé).'; S.mode = 'error'; render(); } }, 15000);
safeBoot();
</script>
</body>
</html>
